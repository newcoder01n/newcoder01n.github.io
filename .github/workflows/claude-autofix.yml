name: Claude Auto Fix Build

# 仅当 GitHub Pages 的构建部署（pages-build-deployment）失败后才触发。
# 构建成功时，本 workflow 的 job 会被下面的 if 条件整体跳过——连 Ruby 都不装，成本接近 0。
on:
  workflow_run:
    workflows: ["pages-build-deployment"]   # 监听 Pages 默认构建部署
    types: [completed]
  workflow_dispatch:                         # 也支持手动触发排查

permissions:
  contents: write   # 允许提交修复

jobs:
  build-and-fix:
    runs-on: ubuntu-latest
    # 关键开关：只有「手动触发」或「被监听的 Pages 构建失败」时才进入这个 job。
    # Pages 构建成功 → 条件为 false → 整个 job 跳过，不消耗构建资源。
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master   # workflow_run 场景下显式 checkout master，确保修的是发布分支

      # Jekyll 基于 Ruby，需安装 Ruby 环境（仅在 job 真正运行时才执行到这里）
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true   # 自动 bundle install 并缓存 gems

      - name: Build (Jekyll)
        id: build
        run: |
          # 复现一次构建以拿到错误日志（供 Claude 分析）
          bundle exec jekyll build > build.log 2>&1 && echo "failed=false" >> $GITHUB_OUTPUT || echo "failed=true" >> $GITHUB_OUTPUT
          cat build.log

      - name: Install Claude Code
        if: steps.build.outputs.failed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Claude auto-fix
        if: steps.build.outputs.failed == 'true'
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: |
          claude -p "这是一个 Jekyll（GitHub Pages）站点。读取项目根目录的 build.log，分析导致 jekyll build 失败的错误（常见：_config.yml 语法、Liquid 模板错误、front matter 格式、缺失文件链接），并修复对应文件。修复后不要改动无关内容。" \
            --allowedTools "Read,Edit,Bash(cat:*),Bash(bundle exec jekyll build:*)" \
            --max-turns 20 || true

      - name: Commit fixes
        if: steps.build.outputs.failed == 'true'
        run: |
          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix: auto-fix Jekyll build errors by Claude" && git push || echo "无改动可提交"
